# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  - variable: PUBLIC_FIREBASE_API_KEY
    secret: PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: PUBLIC_FIREBASE_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: PUBLIC_FIREBASE_PROJECT_ID
    secret: PUBLIC_FIREBASE_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: PUBLIC_FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]
  - variable: PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability: [BUILD, RUNTIME]
  - variable: PUBLIC_FIREBASE_APP_ID
    secret: PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: PUBLIC_FIREBASE_MEASUREMENT_ID
    availability: [BUILD, RUNTIME]
  - variable: PUBLIC_PUZZLE_METADATA_ENDPOINT
    secret: PUBLIC_PUZZLE_METADATA_ENDPOINT
    availability: [BUILD, RUNTIME]
  - variable: PUBLIC_ADMIN_EMAILS
    secret: PUBLIC_ADMIN_EMAILS
    availability: [BUILD, RUNTIME]

  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef
